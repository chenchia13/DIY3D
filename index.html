<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>印想·DIY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=ZCOOL+XiaoWei&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ead6;
    --paper-2:#ece0c6;
    --card:#fbf6ea;
    --ink:#33402f;
    --green:#3c6b3f;
    --green-deep:#2c5230;
    --teal:#2f6b5f;
    --rust:#c0713a;
    --grid:rgba(60,107,63,.12);
    --line:#cdbd97;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:34px 34px;
    line-height:1.8;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .hand{font-family:'Caveat',cursive;}
  .serif{font-family:'ZCOOL XiaoWei',serif;}
  .container{max-width:1140px;margin:0 auto;padding:0 26px;position:relative;z-index:2;}

  /* crop marks */
  .mark{position:fixed;width:22px;height:22px;z-index:998;pointer-events:none;}
  .mark::before,.mark::after{content:"";position:absolute;background:rgba(51,64,47,.5);}
  .mark::before{width:100%;height:1.5px;top:0;}
  .mark::after{height:100%;width:1.5px;left:0;}
  .m-tl{top:12px;left:12px;}
  .m-tr{top:12px;right:12px;}
  .m-tr::after{left:auto;right:0;}
  .m-bl{bottom:12px;left:12px;}
  .m-bl::before{top:auto;bottom:0;}
  .m-br{bottom:12px;right:12px;}
  .m-br::before{top:auto;bottom:0;}
  .m-br::after{left:auto;right:0;}

  /* top tape label */
  .top{padding-top:16px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
  .stamp{
    display:inline-flex;align-items:center;gap:10px;background:var(--green);color:var(--paper);
    font-family:'ZCOOL XiaoWei',serif;font-size:28px;padding:3px 14px;border-radius:5px;
    box-shadow:5px 5px 0 rgba(51,64,47,.18);letter-spacing:.04em;
  }
  .stamp .dot{width:14px;height:14px;border-radius:50%;background:var(--rust);}
  .nav{display:flex;gap:8px;flex-wrap:wrap;}
  .nav a{
    text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;letter-spacing:.03em;
    padding:9px 16px;border:1.5px solid var(--line);border-radius:40px;background:var(--card);transition:all .3s;
  }
  .nav a:hover{background:var(--green);color:var(--paper);border-color:var(--green);transform:translateY(-2px) rotate(-1deg);}

  /* hero */
  .hero{padding:50px 0 30px;}
  .hero .meta{font-family:'Caveat',cursive;font-size:26px;color:var(--teal);margin-bottom:8px;}
  h1{font-family:'ZCOOL XiaoWei',serif;font-size:clamp(40px,8.5vw,104px);line-height:.95;letter-spacing:.02em;}
  h1 .hl{color:var(--green);position:relative;display:inline-block;}
  h1 .hl::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:.16em;background:var(--rust);opacity:.5;z-index:-1;}
  .hero .sub{max-width:560px;margin-top:30px;font-size:18px;font-weight:300;}
  .hero .sub b{color:var(--green);font-weight:500;}
  .note{
    margin-top:38px;display:inline-block;font-family:'Caveat',cursive;font-size:24px;color:var(--ink);
    transform:rotate(-2deg);
  }
  .note span{color:var(--rust);}

  /* tools ribbon */
  .ribbon{display:flex;flex-wrap:wrap;gap:12px;margin-top:44px;}
  .chip{
    display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;
    background:var(--card);border:1.5px dashed var(--green);color:var(--green);border-radius:40px;padding:8px 16px;
  }
  .chip svg{width:16px;height:16px;stroke:var(--green);fill:none;stroke-width:1.8;}

  /* workbench grid */
  .bench{padding:40px 0 80px;}
  .sec-tag{display:flex;align-items:center;gap:14px;margin-bottom:34px;}
  .sec-tag .lab{font-family:'ZCOOL XiaoWei',serif;font-size:34px;}
  .sec-tag .rule{flex:1;height:1.5px;background:var(--line);}
  .sec-tag .idx{font-family:'Caveat',cursive;font-size:24px;color:var(--teal);}
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .tool{
    background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:26px 24px 28px;position:relative;
    box-shadow:5px 5px 0 rgba(51,64,47,.08);transition:transform .3s ease, box-shadow .3s ease;
  }
  .tool:hover{transform:translate(-4px,-4px) rotate(-.6deg);box-shadow:10px 10px 0 rgba(51,64,47,.12);}
  .tool .topline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .tool .icon{width:56px;height:56px;border-radius:10px;background:var(--paper-2);display:grid;place-items:center;}
  .tool .icon svg{width:30px;height:30px;stroke:var(--green);fill:none;stroke-width:1.6;}
  .tool .code{font-family:'IBM Plex Mono',monospace,'Noto Sans TC';font-size:12px;letter-spacing:.1em;color:var(--rust);font-weight:700;}
  .tool h3{font-family:'ZCOOL XiaoWei',serif;font-size:26px;margin-bottom:10px;}
  .tool p{font-size:14.5px;color:#5b6552;font-weight:300;line-height:1.75;}
  .tool .foot{margin-top:16px;font-family:'Caveat',cursive;font-size:20px;color:var(--teal);}
  .tool:nth-child(3n+1) .icon{background:rgba(60,107,63,.12);}
  .tool:nth-child(3n+2) .icon{background:rgba(47,107,95,.12);}
  .tool:nth-child(3n+2) .icon svg{stroke:var(--teal);}

  /* showcase band - ticket style */
  .showcase{
    background:var(--green-deep);color:var(--paper);margin:20px 0;border-radius:12px;overflow:hidden;position:relative;
    box-shadow:8px 8px 0 rgba(51,64,47,.14);
  }
  .showcase::before{
    content:"";position:absolute;inset:0;opacity:.15;
    background-image:linear-gradient(90deg,var(--paper) 1px,transparent 1px);background-size:18px 100%;
  }
  .sc-in{padding:45px 46px;position:relative;z-index:2;display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:center;}
  .showcase h2{font-family:'ZCOOL XiaoWei',serif;font-size:clamp(30px,5vw,48px);line-height:1.2;}
  .showcase h2 .y{color:var(--rust);}
  .showcase p{margin-top:18px;font-size:15px;color:rgba(243,234,214,.82);max-width:440px;font-weight:300;}
  .tickets{display:flex;flex-direction:column;gap:12px;}
  .ticket{
    display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--green-deep);
    background:var(--paper);border-radius:6px;padding:16px 20px;transition:transform .3s;position:relative;
  }
  .ticket:hover{transform:translateX(8px);}
  .ticket .tt{font-family:'ZCOOL XiaoWei',serif;font-size:26px;}
  .ticket .tt small{display:block;font-family:'Noto Sans TC';font-size:12px;color:#7a8570;font-weight:300;margin-top:2px;}
  .ticket .go{font-family:'Caveat',cursive;font-size:26px;color:var(--rust);}
  .ticket::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--green);border-radius:3px;}

  /* curiosity footer quote */
  .curiosity{padding:40px 0 20px;text-align:center;}
  .curiosity .q{font-family:'Caveat',cursive;font-size:clamp(22px,3vw,52px);color:var(--green);line-height:1.4;}
  .curiosity .q span{color:var(--rust);}
  .curiosity .en{margin-top:16px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8a9080;}

  footer{border-top:1.5px dashed var(--line);margin-top:30px;padding:30px 0 20px;}
  .f-in{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;align-items:center;}
  .f-brand{font-family:'ZCOOL XiaoWei',serif;font-size:24px;}
  .f-links{display:flex;gap:18px;flex-wrap:wrap;}
  .f-links a{text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;border-bottom:1.5px solid var(--line);padding-bottom:3px;transition:all .3s;}
  .f-links a:hover{color:var(--green);border-color:var(--green);}
  .copy{width:100%;margin-top:28px;font-family:'Caveat',cursive;font-size:22px;color:#8a9080;}

  @media(max-width:820px){
    .tools{grid-template-columns:1fr;}
    .sc-in{grid-template-columns:1fr;padding:36px 26px;}
    .mark{display:none;}
  }
</style>
</head>
<body>

<div class="top">
  <div class="container topbar">
    <div class="stamp"><span class="dot"></span>印想·DIY</div>
    <div class="nav">
    </div>
  </div>
</div>

<header class="hero container">
  <h1>讓眼界<span class="hl">翱翔</span>,
    任創意<span class="hl">發芽</span></h1>
  <p class="sub">一層層印、一道道刻，在天空看一片片風景 --用赤子心探索這世界。<br>喜歡親手<b>創作</b>、喜歡<b>修復&nbsp;</b> --也喜歡把值得珍惜的東西留下。</p>
</header>


<section class="container">
  <div class="showcase">
    <div class="sc-in">
      <div>
        <h2>翻開我們做過的<br>那一疊 <span class="y">手記</span>。</h2>
        <p>就算最終仍須道別，也希望能多陪久一點。</p>
      </div>
      <div class="tickets">
        <a class="ticket" href="./Services.html" target="_blank" rel="noopener"><div class="tt">服務項目<small>列印・雕刻・客製委託・修復・空拍</small></div><div class="go">go→</div></a>
        <a class="ticket" href="./Showcases.html" target="_blank" rel="noopener"><div class="tt">成果展示<small>作品集・紀錄</small></div><div class="go">go→</div></a>
        <a class="ticket" href="https://example.com/scout" target="_blank" rel="noopener"><div class="tt">科園童軍團<small>智、仁、勇・共學・探索 與成長。</small></div><div class="go">go→</div></a>
        <a class="ticket" href="https://example.com/contact" target="_blank" rel="noopener"><div class="tt">聯絡我們<small>預約・合作・諮詢</small></div><div class="go">go→</div></a>
      </div>
    </div>
  </div>
</section>

<section class="curiosity container">
  <div class="q">好奇‧手作‧探索‧創造我們的世界</div>
  <div class="en">Stay curious · Make it · Mend it · Share it</div>
</section>

<footer>
  <div class="container f-in">
    <div class="f-brand">印想 ·&nbsp;DIY</div>
  </div>
</footer>

</body>
</html>
